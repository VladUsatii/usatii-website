<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1584"
  height="396"
  viewBox="0 0 1584 396"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">USATII MEDIA LinkedIn banner</title>
  <desc id="description">A centered purple orb and black italic USATII MEDIA wordmark on light gray.</desc>

  <defs>
    <radialGradient id="orb" cx="30%" cy="24%" r="82%">
      <stop offset="0" stop-color="#d06bff" />
      <stop offset="0.46" stop-color="#a83eed" />
      <stop offset="1" stop-color="#7724ce" />
    </radialGradient>
    <linearGradient id="orb-sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.24" />
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="1584" height="396" fill="#f5f5f3" />

  <!-- The lockup is 366px wide: 48px orb + 19px gap + 299px wordmark. -->
  <g transform="translate(609 174)">
    <circle cx="24" cy="24" r="24" fill="url(#orb)" />
    <circle cx="24" cy="24" r="23.5" fill="url(#orb-sheen)" />

    <text
      x="67"
      y="38"
      fill="#181818"
      font-family="Inter, Arial, sans-serif"
      font-size="45"
      font-style="italic"
      font-weight="700"
      letter-spacing="-2.35"
      textLength="299"
      lengthAdjust="spacingAndGlyphs"
    >USATII MEDIA</text>
  </g>
</svg>
