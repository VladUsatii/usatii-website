<svg
  xmlns="http://www.w3.org/2000/svg"
  width="500"
  height="500"
  viewBox="0 0 500 500"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">USATII MEDIA purple orb icon</title>
  <desc id="description">The purple USATII MEDIA orb centered on the brand's light gray background.</desc>

  <defs>
    <radialGradient id="orb" cx="30%" cy="24%" r="82%">
      <stop offset="0" stop-color="#d06bff" />
      <stop offset="0.46" stop-color="#a83eed" />
      <stop offset="1" stop-color="#7724ce" />
    </radialGradient>
    <linearGradient id="orb-sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.24" />
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="500" height="500" fill="#f5f5f3" />
  <circle cx="250" cy="250" r="140" fill="url(#orb)" />
  <circle cx="250" cy="250" r="137" fill="url(#orb-sheen)" />
</svg>
